server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Serve hashed assets aggressively; they change on every build.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Never cache index.html to avoid stale chunk references after rebuilds.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        expires -1;
        try_files $uri =404;
    }

    # SPA fallback (Quasar SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

